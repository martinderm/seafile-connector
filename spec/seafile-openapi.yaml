openapi: 3.0.3
info:
  title: Seafile Web API (curated subset for the Seafile connector)
  version: api2-curated.1
  description: |
    Curated subset of the official Seafile OpenAPI spec
    (https://github.com/haiwen/seafile-open-api — docs:
    https://manual.seafile.com/latest/develop/web_api_v2.1/) covering the
    cloud-atlas read path: libraries, directory listings (with mtime/size for
    change detection), file details, download/upload links, search, trash.

    All routes use the classic **account API** (`/api2/...`), which requires
    an account token. Repo-scoped library tokens use the separate
    `/api/v2.1/via-repo-token/...` API and are not covered by this spec.

    Upload itself is a multipart POST to the upload link and is typically NOT
    converted by an OpenAPI import — use the portable skill scripts or an MCP
    fallback for uploads.

    Auth: Seafile API token, sent verbatim as `Authorization: Token <api-token>`
    (Seafile token scheme; `Bearer <token>` is also accepted on Seafile >= 11).
    The account API (`/api2/...`) requires an account token; library tokens
    cannot be used with these routes.

    Generate the token in the Seafile web UI (Avatar → Settings → API Token);
    store it in your platform's secret store — never in this file or the repo.
servers:
  - url: https://seafile.example.org
    description: Seafile server root. Overridden by the connector's server URL.
tags:
  - name: seafile
    description: Seafile REST API v2.1
security:
  - tokenAuth: []
paths:
  /api2/repos/:
    get:
      operationId: list_repos
      tags: [seafile]
      summary: List libraries (repos) visible to the token's account
      parameters:
        - name: page
          in: query
          schema: {type: integer, default: 1}
        - name: per_page
          in: query
          schema: {type: integer, default: 100, maximum: 1000}
      responses:
        "200":
          description: Array of repositories
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Repo"}
  /api2/repos/{repo_id}/:
    get:
      operationId: get_repo
      tags: [seafile]
      summary: Get details of one library
      parameters:
        - $ref: "#/components/parameters/RepoId"
      responses:
        "200":
          description: Repository details
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Repo"}
  /api2/repos/{repo_id}/dir/:
    get:
      operationId: list_dir
      tags: [seafile]
      summary: List a directory (entries include type, size, mtime, id — basis for filemap change detection)
      parameters:
        - $ref: "#/components/parameters/RepoId"
        - name: p
          in: query
          description: Directory path inside the repo, e.g. `/` or `/docs/`
          schema: {type: string, default: "/"}
      responses:
        "200":
          description: Array of directory entries
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/DirEntry"}
  /api2/repos/{repo_id}/file/detail/:
    get:
      operationId: get_file_detail
      tags: [seafile]
      summary: Get file metadata/detail for a path (NOT the content/download endpoint)
      parameters:
        - $ref: "#/components/parameters/RepoId"
        - name: p
          in: query
          required: true
          description: File path inside the repo
          schema: {type: string}
      responses:
        "200":
          description: File detail
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FileDetail"}
  /api2/repos/{repo_id}/download-link/:
    get:
      operationId: get_download_link
      tags: [seafile]
      summary: Get a download link for a file (binary downloads may only yield links/metadata through an HTTP connector)
      parameters:
        - $ref: "#/components/parameters/RepoId"
        - name: p
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Download link payload
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LinkResponse"}
  /api2/repos/{repo_id}/upload-link/:
    get:
      operationId: get_upload_link
      tags: [seafile]
      summary: Get an upload link (write operation — keep on manual approval; the multipart POST itself is usually not importable)
      parameters:
        - $ref: "#/components/parameters/RepoId"
        - name: p
          in: query
          description: Target directory path, e.g. `/docs/`
          schema: {type: string, default: "/"}
      responses:
        "200":
          description: Upload link payload
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LinkResponse"}
  /api2/repos/{repo_id}/trash/:
    get:
      operationId: list_trash
      tags: [seafile]
      summary: List deleted items (trash) of a library
      parameters:
        - $ref: "#/components/parameters/RepoId"
        - name: page
          in: query
          schema: {type: integer, default: 1}
        - name: per_page
          in: query
          schema: {type: integer, default: 100, maximum: 1000}
      responses:
        "200":
          description: Array of trash entries
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/TrashEntry"}
  /api2/beshared-repos/:
    get:
      operationId: list_beshared_repos
      tags: [seafile]
      summary: List libraries shared WITH this account ("shared to me"; documented route /api2/beshared-repos/ — sharer in `user`, `share_type` personal/group, `permission` r/rw)
      responses:
        "200":
          description: Array of shared-in libraries
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/SharedRepo"}
  /api2/shared-repos/:
    get:
      operationId: list_shared_repos
      tags: [seafile]
      summary: List libraries this account shared with OTHERS ("shared by me"; route /api2/shared-repos/)
      responses:
        "200":
          description: Array of shared libraries
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/SharedRepo"}
  /api2/account/info/:
    get:
      operationId: get_account_info
      tags: [seafile]
      summary: Account info (email, name, quota usage/total) — sanity check for the credential
      responses:
        "200":
          description: Account info object
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LooseObject"}
  /api2/server-info/:
    get:
      operationId: get_server_info
      tags: [seafile]
      summary: Server version/features (anonymous health check)
      responses:
        "200":
          description: Server info object (version, features)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LooseObject"}
  /api2/default-repo/:
    get:
      operationId: get_default_repo
      tags: [seafile]
      summary: Default library of the account
      responses:
        "200":
          description: Default repo object
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LooseObject"}
  /api/v2.1/starred-items/:
    get:
      operationId: list_starred_items
      tags: [seafile]
      summary: Starred (favorite) libraries/folders/files of the account
      responses:
        "200":
          description: Object with `starred_item_list` array
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LooseObject"}
  /api/v2.1/shared-folders/:
    get:
      operationId: list_shared_folders
      tags: [seafile]
      summary: Folders shared with this account (by others)
      responses:
        "200":
          description: Array of shared folders
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/LooseObject"}
  /api/v2.1/share-links/:
    get:
      operationId: list_share_links
      tags: [seafile]
      summary: All download share links of the account (all libraries)
      responses:
        "200":
          description: Array of share links (token, link, permissions, view_cnt, expire_date)
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/LooseObject"}
  /api/v2.1/repos/{repo_id}/share-links/:
    get:
      operationId: list_repo_share_links
      tags: [seafile]
      summary: Share links of one library
      parameters:
        - $ref: "#/components/parameters/RepoId"
      responses:
        "200":
          description: Array of share links
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/LooseObject"}
  /api2/groups/:
    get:
      operationId: list_groups
      tags: [seafile]
      summary: Groups of the account
      responses:
        "200":
          description: Object with `groups` array
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LooseObject"}
  /api/v2.1/groups/{group_id}/:
    get:
      operationId: get_group
      tags: [seafile]
      summary: Details of one group
      parameters:
        - name: group_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        "200":
          description: Group object
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LooseObject"}
  /api/v2.1/groups/{group_id}/members/:
    get:
      operationId: list_group_members
      tags: [seafile]
      summary: Members of a group (incl. admin/owner roles)
      parameters:
        - name: group_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        "200":
          description: Array of group members
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/LooseObject"}
  /api2/repos/{repo_id}/dir/shared_items/:
    get:
      operationId: list_shared_items
      tags: [seafile]
      summary: With whom a library/folder is shared (share_type user/group, permission)
      parameters:
        - $ref: "#/components/parameters/RepoId"
        - name: p
          in: query
          schema: {type: string, default: "/"}
        - name: share_type
          in: query
          description: Filter by share_type (user or group)
          schema: {type: string}
      responses:
        "200":
          description: Array of share entries (user_info/group_info, permission, is_admin)
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/LooseObject"}
  /api/v2.1/repos/{repo_id}/dir/detail/:
    get:
      operationId: get_dir_detail
      tags: [seafile]
      summary: Directory detail (incl. share/permission info)
      parameters:
        - $ref: "#/components/parameters/RepoId"
        - name: path
          in: query
          required: true
          description: Path of the directory, e.g. /Develop (official v2.1 docs use `path` here, not `p`)
          schema: {type: string}
      responses:
        "200":
          description: Directory detail object
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LooseObject"}
  /api/v2.1/repos/{repo_id}/file/history/:
    get:
      operationId: get_file_history
      tags: [seafile]
      summary: Version history of a file (commit ids for revision download / change detection)
      parameters:
        - $ref: "#/components/parameters/RepoId"
        - name: path
          in: query
          required: true
          description: File path (official v2.1 docs use `path` here, not `p`)
          schema: {type: string}
        - name: commit_id
          in: query
          schema: {type: string}
          description: Continue history from this commit; use `next_start_commit` from the previous response. If omitted, the library head commit is used.
      responses:
        "200":
          description: File history (commits) object
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LooseObject"}
  /api2/repos/{repo_id}/file/revision/:
    get:
      operationId: get_file_revision_link
      tags: [seafile]
      summary: Download link for a file at a given commit (revision)
      parameters:
        - $ref: "#/components/parameters/RepoId"
        - name: p
          in: query
          required: true
          schema: {type: string}
        - name: commit_id
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Download link for the revision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LinkResponse"}
  /api/v2.1/repos/{repo_id}/history/:
    get:
      operationId: get_repo_history
      tags: [seafile]
      summary: Commit history of a library (who/what/when, client, device)
      parameters:
        - $ref: "#/components/parameters/RepoId"
        - name: page
          in: query
          schema: {type: integer, default: 1}
        - name: per_page
          in: query
          schema: {type: integer, default: 100, maximum: 1000}
      responses:
        "200":
          description: Object with `data` array of commits
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LooseObject"}
  /api/v2.1/smart-link/:
    get:
      operationId: get_smart_link
      tags: [seafile]
      summary: Stable smart link (permalink) for a file/folder — good for catalog references
      parameters:
        - name: repo_id
          in: query
          required: true
          schema: {type: string}
        - name: path
          in: query
          required: true
          description: Path of the file/folder, e.g. /8.md
          schema: {type: string}
        - name: is_dir
          in: query
          required: true
          description: true if the path is a directory, false for a file
          schema: {type: boolean}
      responses:
        "200":
          description: Smart link object
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LooseObject"}
  /api/v2.1/repos/{repo_id}/zip-task/:
    get:
      operationId: get_zip_task
      tags: [seafile]
      summary: Start a zip task for files/folders (bulk download); returns zip_token
      description: >-
        Although this is an HTTP GET, it starts an asynchronous server-side zip
        job and consumes server resources — treat it as a side-effecting
        operation (manual approval in connector UIs), NOT as a pre-authorized
        read-only tool.
      parameters:
        - $ref: "#/components/parameters/RepoId"
        - name: parent_dir
          in: query
          required: true
          description: Parent directory of the items to archive, e.g. /
          schema: {type: string}
        - name: dirents
          in: query
          required: true
          description: Comma-separated names of the files/folders to archive, e.g. "my_dir_name" or "a.md,b.pdf"
          schema: {type: string}
      responses:
        "200":
          description: Zip task object (zip_token)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LooseObject"}
  /api/v2.1/query-zip-progress/:
    get:
      operationId: get_zip_progress
      tags: [seafile]
      summary: Progress of a zip task (by token); includes the download link when done
      parameters:
        - name: token
          in: query
          required: true
          description: The zip_token returned by the zip-task operation (official docs use query key `token`)
          schema: {type: string}
      responses:
        "200":
          description: Zip progress object
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LooseObject"}
  /api2/search/:
    get:
      operationId: search_files
      tags: [seafile]
      summary: Search files across libraries (account API — requires an account token)
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string}
        - name: search_repo
          in: query
          required: true
          description: Library UUID to search in (Seafile's filter parameter is `search_repo`, not `repo_id`)
          schema: {type: string}
        - name: page
          in: query
          schema: {type: integer, default: 1}
        - name: per_page
          in: query
          schema: {type: integer, default: 100, maximum: 1000}
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: {$ref: "#/components/schemas/SearchHit"}
components:
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Seafile API token, sent verbatim in the Authorization header as
        `Token <api-token>` (Seafile token scheme; `Bearer <token>` is only
        accepted on Seafile >= 11).
  parameters:
    RepoId:
      name: repo_id
      in: path
      required: true
      description: Library (repo) ID, a UUID
      schema: {type: string}
  schemas:
    LooseObject:
      type: object
      additionalProperties: true
    Repo:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        size: {type: integer}
        encrypted: {type: boolean}
        permission: {type: string}
        mtime: {type: integer}
      additionalProperties: true
    DirEntry:
      type: object
      properties:
        type: {type: string, enum: [file, dir]}
        name: {type: string}
        id: {type: string, description: object id (oid)}
        size: {type: integer}
        mtime: {type: integer, description: unix timestamp of last modification}
      additionalProperties: true
    FileDetail:
      type: object
      properties:
        type: {type: string}
        name: {type: string}
        id: {type: string}
        size: {type: integer}
        mtime: {type: integer}
        download_url: {type: string}
      additionalProperties: true
    LinkResponse:
      type: string
      format: uri
      description: The Seafile link endpoints return the link as a plain URI string.
    TrashEntry:
      type: object
      properties:
        repo_id: {type: string}
        parent_dir: {type: string}
        obj_name: {type: string}
        deleted_time: {type: integer}
      additionalProperties: true
    SharedRepo:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        repo_id: {type: string}
        repo_name: {type: string}
        user: {type: string, description: owner/sharer of the library}
        share_type: {type: string, enum: [personal, group]}
        group_id: {type: integer}
        permission: {type: string, enum: [r, rw]}
        is_shared: {type: boolean}
        size: {type: integer}
        last_modified: {type: integer, description: unix timestamp of last modification (API key is `last_modified`)}
        encrypted: {type: boolean}
      additionalProperties: true
    SearchHit:
      type: object
      properties:
        repo_id: {type: string}
        repo_name: {type: string}
        path: {type: string}
        name: {type: string}
        size: {type: integer}
        mtime: {type: integer}
        score: {type: number}
      additionalProperties: true
